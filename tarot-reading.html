<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯占 (とうせん) — 個人タロット鑑定</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@400;600&family=Jost:wght@300;400;500;600&display=swap');

:root{
  --bg: #14101f;
  --bg-deep: #0c0916;
  --surface: #1f1a30;
  --surface-2: #29223f;
  --gold: #c9a15a;
  --gold-soft: rgba(201,161,90,0.35);
  --text: #ece7db;
  --muted: #9c93b0;
  --rose: #b5695f;
  --radius: 2px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,161,90,0.08), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Jost',sans-serif;
  font-weight:300;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:32px 20px 80px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* header */
.brand{
  text-align:center;
  margin-bottom:36px;
}
.brand-mark{
  width:34px; height:34px;
  margin:0 auto 12px;
  opacity:0.85;
}
.brand-title{
  font-family:'Shippori Mincho',serif;
  font-size:26px;
  letter-spacing:0.35em;
  padding-left:0.35em;
  color:var(--text);
}
.brand-sub{
  font-family:'Jost',sans-serif;
  font-size:11px;
  letter-spacing:0.25em;
  color:var(--muted);
  margin-top:8px;
  text-transform:uppercase;
}

/* nav / history toggle */
.top-row{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:4px;
}
.icon-btn{
  background:none; border:1px solid transparent;
  color:var(--muted); font-family:'Jost',sans-serif;
  font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
  cursor:pointer; padding:6px 10px; border-radius:var(--radius);
  transition:color 0.2s, border-color 0.2s;
}
.icon-btn:hover{ color:var(--gold); border-color:var(--gold-soft); }

/* screens */
.screen{ display:none; flex:1; flex-direction:column; }
.screen.active{ display:flex; animation:fadeIn 0.5s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.step-label{
  font-size:11px; letter-spacing:0.25em; text-transform:uppercase;
  color:var(--gold); margin-bottom:10px; text-align:center;
}
.step-title{
  font-family:'Shippori Mincho',serif;
  font-size:22px; text-align:center; margin-bottom:28px; line-height:1.7;
  color:var(--text);
}

/* theme chips */
.chip-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-bottom:24px;
}
.chip{
  background:var(--surface);
  border:1px solid rgba(201,161,90,0.15);
  color:var(--text);
  padding:16px 10px;
  text-align:center;
  font-family:'Shippori Mincho',serif;
  font-size:15px;
  cursor:pointer;
  border-radius:var(--radius);
  transition:all 0.2s;
}
.chip:hover{ border-color:var(--gold-soft); }
.chip.selected{
  border-color:var(--gold);
  background:var(--surface-2);
  box-shadow:0 0 0 1px var(--gold-soft) inset;
}

textarea, input[type=text]{
  width:100%;
  background:var(--surface);
  border:1px solid rgba(201,161,90,0.15);
  color:var(--text);
  font-family:'Jost',sans-serif;
  font-size:14px;
  font-weight:300;
  padding:14px;
  border-radius:var(--radius);
  resize:none;
  line-height:1.6;
}
textarea:focus, input:focus{ outline:none; border-color:var(--gold-soft); }
textarea::placeholder, input::placeholder{ color:#5f5871; }

.field-note{
  font-size:11px; color:var(--muted); margin-top:8px; letter-spacing:0.03em;
}

/* spread cards (selection) */
.spread-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
.spread-card{
  background:var(--surface);
  border:1px solid rgba(201,161,90,0.15);
  padding:18px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:all 0.2s;
  display:flex; justify-content:space-between; align-items:center;
}
.spread-card:hover{ border-color:var(--gold-soft); }
.spread-card.selected{ border-color:var(--gold); background:var(--surface-2); }
.spread-card-name{ font-family:'Shippori Mincho',serif; font-size:17px; }
.spread-card-desc{ font-size:12px; color:var(--muted); margin-top:4px; }
.spread-card-count{ font-size:11px; color:var(--gold); letter-spacing:0.1em; white-space:nowrap; margin-left:12px;}

/* primary button */
.btn-primary{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:'Jost',sans-serif;
  font-size:12px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  padding:16px;
  cursor:pointer;
  border-radius:var(--radius);
  margin-top:auto;
  transition:all 0.25s;
}
.btn-primary:hover:not(:disabled){ background:var(--gold); color:var(--bg-deep); }
.btn-primary:disabled{ opacity:0.3; cursor:not-allowed; }
.btn-ghost{
  background:none; border:none; color:var(--muted);
  font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.1em;
  text-align:center; margin-top:14px; cursor:pointer; text-decoration:underline;
  text-underline-offset:4px;
}

/* shuffle scene */
.shuffle-scene{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:28px;
}
.deck{
  position:relative; width:120px; height:180px;
}
.deck-card{
  position:absolute; inset:0;
  border:1px solid var(--gold-soft);
  border-radius:6px;
  background:
    radial-gradient(circle at 50% 50%, rgba(201,161,90,0.12), transparent 60%),
    var(--surface);
}
.deck-card svg{ width:100%; height:100%; }
.deck.shuffling .deck-card:nth-child(1){ animation:shuffle1 1.1s ease-in-out infinite; }
.deck.shuffling .deck-card:nth-child(2){ animation:shuffle2 1.1s ease-in-out infinite 0.08s; }
.deck.shuffling .deck-card:nth-child(3){ animation:shuffle3 1.1s ease-in-out infinite 0.16s; }
@keyframes shuffle1{ 0%,100%{transform:translateX(0) rotate(0);} 50%{transform:translateX(-14px) rotate(-6deg);} }
@keyframes shuffle2{ 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-8px) rotate(2deg);} }
@keyframes shuffle3{ 0%,100%{transform:translateX(0) rotate(0);} 50%{transform:translateX(14px) rotate(6deg);} }
.shuffle-hint{ font-size:12px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; }

/* draw layout */
.draw-scene{ flex:1; display:flex; flex-direction:column; }
.positions{
  display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  margin:24px 0 20px;
}
.position-slot{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.position-name{ font-size:11px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; }

.tarot-card{
  width:104px; height:168px;
  perspective:1000px;
  cursor:pointer;
}
.tarot-card-inner{
  position:relative; width:100%; height:100%;
  transition:transform 0.7s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.tarot-card.flipped .tarot-card-inner{ transform:rotateY(180deg); }
.tarot-card.flipped.reversed .tarot-card-inner{ transform:rotateY(180deg) rotate(180deg); }
.card-face{
  position:absolute; inset:0;
  border-radius:6px;
  backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--gold-soft);
}
.card-back{
  background:var(--surface);
  background-image:
    radial-gradient(circle at 50% 50%, rgba(201,161,90,0.10), transparent 65%);
}
.card-back svg{ width:70%; height:70%; opacity:0.75; }
.card-front{
  background:var(--surface-2);
  transform:rotateY(180deg);
  flex-direction:column;
  padding:10px 8px;
  text-align:center;
  gap:6px;
}
.card-front .suit-icon{ width:26px; height:26px; opacity:0.85; }
.card-front .card-num{
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:11px; color:var(--gold); letter-spacing:0.1em;
}
.card-front .card-name{
  font-family:'Shippori Mincho',serif; font-size:13px; line-height:1.4;
}
.card-front .card-orient{
  font-size:9px; letter-spacing:0.15em; text-transform:uppercase;
  color:var(--rose);
}
.tarot-card.flipped .card-front .card-orient.upright{ color:var(--gold); }

.draw-hint{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:8px; }

/* loading */
.loading-scene{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
}
.loading-ring{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--gold-soft);
  border-top-color:var(--gold);
  animation:spin 1.1s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading-text{ font-size:12px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; }

/* reading */
.reading-scene{ flex:1; display:flex; flex-direction:column; }
.reading-q{
  font-size:12px; color:var(--muted); text-align:center;
  margin-bottom:26px; line-height:1.7; padding:0 10px;
}
.reading-q span{ color:var(--gold); }
.reading-card{
  background:var(--surface);
  border:1px solid rgba(201,161,90,0.15);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
}
.reading-card-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
  padding-bottom:10px; border-bottom:1px solid rgba(201,161,90,0.12);
}
.reading-card-pos{
  font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold);
}
.reading-card-name{
  font-family:'Shippori Mincho',serif; font-size:16px;
}
.reading-card-orient{ font-size:11px; color:var(--rose); margin-left:auto; }
.reading-card-orient.upright{ color:var(--gold); }
.reading-card-body{
  font-size:14px; line-height:1.9; color:var(--text); font-weight:300;
  white-space:pre-wrap;
}
.reading-summary{
  margin-top:8px; padding-top:20px; border-top:1px solid rgba(201,161,90,0.15);
}
.reading-summary-label{
  font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
  margin-bottom:10px; text-align:center;
}
.reading-summary-body{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px;
  line-height:1.9; text-align:center; color:var(--text); padding:0 6px;
}

.action-row{ display:flex; gap:10px; margin-top:26px; }
.action-row .btn-primary{ margin-top:0; flex:1; }
.action-row .btn-secondary{
  flex:1; background:none; border:1px solid rgba(201,161,90,0.2); color:var(--muted);
  font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.15em; text-transform:uppercase;
  padding:16px; border-radius:var(--radius); cursor:pointer;
}

/* history */
.history-empty{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--muted); font-size:13px; text-align:center; gap:10px;
}
.history-list{ display:flex; flex-direction:column; gap:10px; }
.history-item{
  background:var(--surface); border:1px solid rgba(201,161,90,0.12);
  border-radius:var(--radius); padding:16px; cursor:pointer;
}
.history-item:hover{ border-color:var(--gold-soft); }
.history-item-date{ font-size:10px; color:var(--muted); letter-spacing:0.1em; margin-bottom:6px; }
.history-item-q{ font-size:13px; color:var(--text); font-family:'Shippori Mincho',serif; margin-bottom:6px; }
.history-item-cards{ font-size:11px; color:var(--gold); letter-spacing:0.03em; }

.error-box{
  background:rgba(181,105,95,0.1); border:1px solid rgba(181,105,95,0.4);
  color:var(--rose); font-size:12px; padding:14px; border-radius:var(--radius);
  margin-bottom:16px; line-height:1.6;
}
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="1.5" fill="#c9a15a"/>
      <g stroke="#c9a15a" stroke-width="0.6" opacity="0.8">
        <line x1="20" y1="20" x2="20" y2="4"/>
        <line x1="20" y1="20" x2="20" y2="36"/>
        <line x1="20" y1="20" x2="4" y2="20"/>
        <line x1="20" y1="20" x2="36" y2="20"/>
        <line x1="20" y1="20" x2="30.3" y2="9.7"/>
        <line x1="20" y1="20" x2="9.7" y2="30.3"/>
        <line x1="20" y1="20" x2="30.3" y2="30.3"/>
        <line x1="20" y1="20" x2="9.7" y2="9.7"/>
      </g>
      <circle cx="20" cy="20" r="12" stroke="#c9a15a" stroke-width="0.5" opacity="0.4"/>
    </svg>
    <div class="brand-title">灯占</div>
    <div class="brand-sub">Personal Tarot Reading</div>
  </div>

  <div class="top-row">
    <button class="icon-btn" id="btnHistory">これまでの記録</button>
    <button class="icon-btn" id="btnHome" style="display:none;">はじめから</button>
  </div>

  <!-- STEP 1: 悩み・テーマ入力 -->
  <div class="screen active" id="screen-input">
    <div class="step-label">Step 1</div>
    <div class="step-title">何について<br>占いますか</div>

    <div class="chip-grid" id="themeChips"></div>

    <textarea id="questionText" rows="4" placeholder="具体的な悩みや状況があれば、自由に書いてください(空欄でも大丈夫です)"></textarea>
    <div class="field-note">例:「転職を考えているが踏み出せない」「あの人との距離感に迷っている」</div>

    <button class="btn-primary" id="toSpread" style="margin-top:24px;">次へ</button>
  </div>

  <!-- STEP 2: スプレッド選択 -->
  <div class="screen" id="screen-spread">
    <div class="step-label">Step 2</div>
    <div class="step-title">並べ方を選ぶ</div>
    <div class="spread-list" id="spreadList"></div>
    <button class="btn-primary" id="toShuffle" style="margin-top:24px;">カードを準備する</button>
    <button class="btn-ghost" id="backToInput">戻る</button>
  </div>

  <!-- STEP 3: シャッフル -->
  <div class="screen" id="screen-shuffle">
    <div class="shuffle-scene">
      <div class="step-label">Step 3</div>
      <div class="deck" id="deck">
        <div class="deck-card"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="1.2" fill="#c9a15a"/><g stroke="#c9a15a" stroke-width="0.5" opacity="0.7"><line x1="20" y1="20" x2="20" y2="4"/><line x1="20" y1="20" x2="20" y2="36"/><line x1="20" y1="20" x2="4" y2="20"/><line x1="20" y1="20" x2="36" y2="20"/></g></svg></div>
        <div class="deck-card"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="1.2" fill="#c9a15a"/><g stroke="#c9a15a" stroke-width="0.5" opacity="0.7"><line x1="20" y1="20" x2="20" y2="4"/><line x1="20" y1="20" x2="20" y2="36"/><line x1="20" y1="20" x2="4" y2="20"/><line x1="20" y1="20" x2="36" y2="20"/></g></svg></div>
        <div class="deck-card"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="1.2" fill="#c9a15a"/><g stroke="#c9a15a" stroke-width="0.5" opacity="0.7"><line x1="20" y1="20" x2="20" y2="4"/><line x1="20" y1="20" x2="20" y2="36"/><line x1="20" y1="20" x2="4" y2="20"/><line x1="20" y1="20" x2="36" y2="20"/></g></svg></div>
      </div>
      <div class="shuffle-hint" id="shuffleHint">タップしてシャッフル</div>
      <button class="btn-primary" id="doShuffle" style="width:200px;">シャッフルする</button>
    </div>
  </div>

  <!-- STEP 4: ドロー -->
  <div class="screen" id="screen-draw">
    <div class="step-label">Step 4</div>
    <div class="step-title" id="drawTitle">カードをめくる</div>
    <div class="draw-hint">それぞれのカードをタップしてめくってください</div>
    <div class="positions" id="positions"></div>
    <button class="btn-primary" id="toReading" disabled>鑑定を見る</button>
  </div>

  <!-- STEP 5: ローディング -->
  <div class="screen" id="screen-loading">
    <div class="loading-scene">
      <div class="loading-ring"></div>
      <div class="loading-text">カードを読み解いています</div>
    </div>
  </div>

  <!-- STEP 6: 鑑定結果 -->
  <div class="screen" id="screen-reading">
    <div class="step-label">Result</div>
    <div class="reading-q" id="readingQ"></div>
    <div id="readingCards"></div>
    <div class="reading-card reading-summary" id="readingSummaryBox" style="display:none;">
      <div class="reading-summary-label">総括</div>
      <div class="reading-summary-body" id="readingSummary"></div>
    </div>
    <div class="action-row">
      <button class="btn-secondary" id="btnRedo">もう一度占う</button>
    </div>
    <div id="saveNotice" style="display:none; text-align:center; font-size:11px; letter-spacing:0.08em; margin-top:14px; color:var(--muted);"></div>
  </div>

  <!-- STEP 7: 履歴 -->
  <div class="screen" id="screen-history">
    <div class="step-label">Archive</div>
    <div class="step-title">これまでの鑑定</div>
    <div id="historyBody"></div>
  </div>

</div>

<script>
/* ---------------------------------------------------------
   データ定義
--------------------------------------------------------- */
const MAJOR_ARCANA = [
  {name:"愚者", up:"新しい始まり、無邪気な信頼、未知への一歩", rev:"無謀さ、計画性の欠如、宙ぶらりんな状態"},
  {name:"魔術師", up:"意志の力、持てる手段を活かす、行動の起点", rev:"力の空回り、口先だけ、自信の欠如"},
  {name:"女教皇", up:"直感、静かな知恵、内面との対話", rev:"直感の無視、秘密、表面的な理解"},
  {name:"女帝", up:"豊かさ、育む力、感受性の開花", rev:"過剰、依存、自己犠牲"},
  {name:"皇帝", up:"秩序、責任、自ら築いた基盤", rev:"支配欲、頑なさ、権威への反発"},
  {name:"教皇", up:"伝統、助言、価値観の継承", rev:"形式への疑問、独自の道、教えからの逸脱"},
  {name:"恋人", up:"選択、心の一致、惹かれ合う関係", rev:"迷い、価値観のずれ、決めきれなさ"},
  {name:"戦車", up:"前進する力、意志による統率、勝利への集中", rev:"制御不能、方向性の喪失、空回りする勢い"},
  {name:"力", up:"内なる強さ、優しさによる克服、忍耐", rev:"自信の揺らぎ、力の誇示、抑えきれない衝動"},
  {name:"隠者", up:"内省、一人で見つける答え、静かな探求", rev:"孤立、頑固な閉じこもり、答えを外に求めすぎる"},
  {name:"運命の輪", up:"転機、巡り合わせ、流れの変化", rev:"停滞、悪循環、変化への抵抗"},
  {name:"正義", up:"公正、均衡、結果への責任", rev:"偏り、不公平感、判断の先延ばし"},
  {name:"吊るされた男", up:"視点の転換、待つことの意味、手放す勇気", rev:"無駄な我慢、犠牲の押し付け、停滞への苛立ち"},
  {name:"死神", up:"終わりと再生、手放すことで開ける道", rev:"変化への抵抗、終われない執着、宙づりの状態"},
  {name:"節制", up:"調和、バランスの回復、異なるものの統合", rev:"不調和、行き過ぎ、折り合いの難しさ"},
  {name:"悪魔", up:"執着、依存、抜け出せない習慣", rev:"束縛からの気づき、解放の兆し、依存の自覚"},
  {name:"塔", up:"突然の崩壊、思い込みの瓦解、避けられない変化", rev:"崩壊の先延ばし、内側で進む変化、辛うじての回避"},
  {name:"星", up:"希望、癒し、静かな信頼の回復", rev:"自信喪失、理想と現実のずれ、希望の見えにくさ"},
  {name:"月", up:"不安、曖昧さ、無意識からのメッセージ", rev:"不安の解消、霧が晴れる、誤解の解消"},
  {name:"太陽", up:"成功、明るい活力、素直な喜び", rev:"一時的な曇り、過度な楽観、喜びの先延ばし"},
  {name:"審判", up:"再評価、呼び覚まされる使命、過去との和解", rev:"迷い続ける判断、後悔、決断の先送り"},
  {name:"世界", up:"完成、一つの区切り、達成による統合", rev:"未完了、あと一歩、区切りのつけにくさ"}
];

const SUITS = [
  {key:"wands", name:"ワンド", element:"火", theme:"情熱・行動・意志のエネルギー",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1"><path d="M12 2 L12 22 M8 6 Q12 4 16 6 M8 10 Q12 8 16 10"/></svg>'},
  {key:"cups", name:"カップ", element:"水", theme:"感情・関係・心の動き",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1"><path d="M6 4 Q6 14 12 14 Q18 14 18 4 M12 14 L12 19 M8 21 L16 21"/></svg>'},
  {key:"swords", name:"ソード", element:"風", theme:"思考・葛藤・言葉の力",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1"><path d="M12 2 L12 18 M8 6 L16 6 M9 20 L15 20 M12 18 L12 22"/></svg>'},
  {key:"pentacles", name:"ペンタクル", element:"地", theme:"現実・仕事・積み上げるもの",
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1"><circle cx="12" cy="12" r="8"/><path d="M12 6 L14 11 L19 11 L15 14 L17 19 L12 16 L7 19 L9 14 L5 11 L10 11 Z" stroke-width="0.6"/></svg>'}
];

const NUMBER_MEANING = {
  1:{up:"始まり", rev:"始めきれない足踏み"},
  2:{up:"選択とバランス", rev:"揺れる二択"},
  3:{up:"成長と協力", rev:"足並みの乱れ"},
  4:{up:"安定", rev:"停滞"},
  5:{up:"変化と葛藤", rev:"混乱の続く葛藤"},
  6:{up:"調和と分かち合い", rev:"一方通行の調和"},
  7:{up:"内省と忍耐", rev:"考えすぎる停滞"},
  8:{up:"力の集中と前進", rev:"力の空回り"},
  9:{up:"到達と孤独", rev:"孤立感の強まり"},
  10:{up:"完成と区切り", rev:"重荷になった完成"}
};
const COURT_MEANING = {
  page:{name:"ペイジ", up:"学びはじめる好奇心", rev:"未熟さゆえの空回り"},
  knight:{name:"ナイト", up:"勢いのある行動", rev:"性急さ、突っ走りすぎ"},
  queen:{name:"クイーン", up:"成熟した受容力", rev:"内にこもる感情"},
  king:{name:"キング", up:"確立された統率力", rev:"支配的になった力"}
};

function buildMinorArcana(){
  const cards = [];
  SUITS.forEach(suit=>{
    for(let n=1;n<=10;n++){
      const m = NUMBER_MEANING[n];
      cards.push({
        name:`${suit.name}の${n===1?"エース":n}`,
        suit:suit.key, icon:suit.icon,
        up:`${suit.theme}における${m.up}`,
        rev:`${suit.theme}における${m.rev}`
      });
    }
    ["page","knight","queen","king"].forEach(c=>{
      const cm = COURT_MEANING[c];
      cards.push({
        name:`${suit.name}の${cm.name}`,
        suit:suit.key, icon:suit.icon,
        up:`${suit.theme}を象徴する、${cm.up}`,
        rev:`${suit.theme}を象徴する、${cm.rev}`
      });
    });
  });
  return cards;
}

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#c9a15a" stroke-width="1"><path d="M15 3 A9 9 0 1 0 15 21 A7 7 0 0 1 15 3 Z"/></svg>';
const FULL_DECK = [
  ...MAJOR_ARCANA.map((c,i)=>({...c, suit:"major", num:i, icon:MOON_ICON})),
  ...buildMinorArcana()
];

const THEMES = ["恋愛","仕事","人間関係","総合"];

const SPREADS = {
  single: {name:"一枚引き", desc:"今のあなたへ、ひとことのメッセージ", positions:["メッセージ"]},
  three: {name:"スリーカード", desc:"過去・現在・未来の流れを見る", positions:["過去","現在","未来"]}
};

/* ---------------------------------------------------------
   状態
--------------------------------------------------------- */
let state = {
  theme: null,
  question: "",
  spreadKey: null,
  drawnCards: [], // {card, reversed, position}
  flippedCount: 0
};

/* ---------------------------------------------------------
   画面切り替え
--------------------------------------------------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('btnHome').style.display = (id==='screen-input') ? 'none' : 'inline-block';
}

/* ---------------------------------------------------------
   Step1: テーマ選択
--------------------------------------------------------- */
function renderThemeChips(){
  const wrap = document.getElementById('themeChips');
  wrap.innerHTML = '';
  THEMES.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = t;
    el.onclick = ()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      state.theme = t;
    };
    wrap.appendChild(el);
  });
}

document.getElementById('toSpread').onclick = ()=>{
  state.question = document.getElementById('questionText').value.trim();
  renderSpreadList();
  showScreen('screen-spread');
};

/* ---------------------------------------------------------
   Step2: スプレッド選択
--------------------------------------------------------- */
function renderSpreadList(){
  const wrap = document.getElementById('spreadList');
  wrap.innerHTML = '';
  Object.entries(SPREADS).forEach(([key,s])=>{
    const el = document.createElement('div');
    el.className = 'spread-card';
    el.innerHTML = `<div><div class="spread-card-name">${s.name}</div><div class="spread-card-desc">${s.desc}</div></div><div class="spread-card-count">${s.positions.length}枚</div>`;
    el.onclick = ()=>{
      document.querySelectorAll('.spread-card').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      state.spreadKey = key;
    };
    wrap.appendChild(el);
  });
}

document.getElementById('backToInput').onclick = ()=> showScreen('screen-input');

document.getElementById('toShuffle').onclick = ()=>{
  if(!state.spreadKey){ state.spreadKey = 'single'; }
  showScreen('screen-shuffle');
  document.getElementById('shuffleHint').textContent = 'タップしてシャッフル';
  document.getElementById('deck').classList.remove('shuffling');
};

/* ---------------------------------------------------------
   Step3: シャッフル
--------------------------------------------------------- */
document.getElementById('doShuffle').onclick = (e)=>{
  const deck = document.getElementById('deck');
  deck.classList.add('shuffling');
  document.getElementById('shuffleHint').textContent = '混ぜています…';
  e.target.disabled = true;
  setTimeout(()=>{
    deck.classList.remove('shuffling');
    drawCards();
    renderDrawScreen();
    showScreen('screen-draw');
    e.target.disabled = false;
  }, 1400);
};

function drawCards(){
  const spread = SPREADS[state.spreadKey];
  const shuffled = [...FULL_DECK].sort(()=>Math.random()-0.5);
  state.drawnCards = spread.positions.map((pos,i)=>({
    card: shuffled[i],
    reversed: Math.random() < 0.5,
    position: pos,
    flipped: false
  }));
  state.flippedCount = 0;
}

/* ---------------------------------------------------------
   Step4: ドロー画面
--------------------------------------------------------- */
function renderDrawScreen(){
  const spread = SPREADS[state.spreadKey];
  document.getElementById('drawTitle').textContent = spread.name;
  const wrap = document.getElementById('positions');
  wrap.innerHTML = '';
  state.drawnCards.forEach((d,i)=>{
    const slot = document.createElement('div');
    slot.className = 'position-slot';
    const suitIcon = d.card.icon;
    slot.innerHTML = `
      <div class="position-name">${d.position}</div>
      <div class="tarot-card" data-i="${i}">
        <div class="tarot-card-inner">
          <div class="card-face card-back">${MOON_ICON}</div>
          <div class="card-face card-front">
            <div class="suit-icon">${suitIcon}</div>
            <div class="card-name">${d.card.name}</div>
            <div class="card-orient ${d.reversed?'':'upright'}">${d.reversed?'逆位置':'正位置'}</div>
          </div>
        </div>
      </div>`;
    wrap.appendChild(slot);
  });
  document.querySelectorAll('.tarot-card').forEach(el=>{
    el.onclick = ()=>{
      if(el.classList.contains('flipped')) return;
      const i = +el.dataset.i;
      el.classList.add('flipped');
      if(state.drawnCards[i].reversed) el.classList.add('reversed');
      state.flippedCount++;
      if(state.flippedCount === state.drawnCards.length){
        document.getElementById('toReading').disabled = false;
      }
    };
  });
  document.getElementById('toReading').disabled = true;
}

/* ---------------------------------------------------------
   Step5/6: 鑑定生成
--------------------------------------------------------- */
document.getElementById('toReading').onclick = async ()=>{
  showScreen('screen-loading');
  try{
    const result = await generateReading();
    renderReading(result);
    const saved = await saveHistory(result);
    const notice = document.getElementById('saveNotice');
    if(saved){
      notice.style.display = 'none';
    }else{
      notice.style.display = 'block';
      notice.textContent = '※ この鑑定は記録として保存できませんでした(表示は正常です)';
    }
    showScreen('screen-reading');
  }catch(err){
    console.error(err);
    showScreen('screen-reading');
    document.getElementById('readingCards').innerHTML = `<div class="error-box">鑑定の生成に失敗しました。通信状態を確認して、もう一度お試しください。</div>`;
    document.getElementById('readingQ').textContent = '';
    document.getElementById('readingSummaryBox').style.display = 'none';
  }
};

async function generateReading(){
  const spread = SPREADS[state.spreadKey];
  const cardLines = state.drawnCards.map(d=>
    `- ${d.position}:「${d.card.name}」(${d.reversed?'逆位置':'正位置'}) / キーワード: ${d.reversed ? d.card.rev : d.card.up}`
  ).join('\n');

  const prompt = `あなたは経験豊かなタロット占い師です。以下の個人鑑定のドロー結果をもとに、日本語で鑑定文を作成してください。

【相談テーマ】${state.theme || '指定なし'}
【相談内容】${state.question || '(特に記述なし。テーマに沿った一般的な鑑定を行ってください)'}
【スプレッド】${spread.name}(${spread.positions.join('・')})

【引かれたカード】
${cardLines}

以下のJSON形式のみで出力してください。前置きや説明、コードブロックの記号(\`\`\`)は一切つけないでください。

{
  "cards": [
    { "position": "位置名", "text": "そのカードが、相談内容に対して具体的に何を示しているかの解説。80〜140字程度。断定しすぎず、気づきを促す語り口。相談者を過度に励ましたり不安を煽ったりしない、落ち着いた声で。" }
  ],
  "summary": "全体を通した総括メッセージ。100〜160字程度。結論を押し付けず、相談者自身が考える余地を残す、詩的だが具体性のある一文〜数文。"
}

cards配列は上記の「引かれたカード」の順番と数に対応させてください。`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  const textBlock = data.content.find(b=>b.type==='text');
  let raw = textBlock ? textBlock.text : '{}';
  raw = raw.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(raw);
  return parsed;
}

function renderReading(result){
  document.getElementById('readingQ').innerHTML =
    `<span>${state.theme || '総合'}</span>${state.question ? ' — ' + escapeHtml(state.question) : ''}`;

  const wrap = document.getElementById('readingCards');
  wrap.innerHTML = '';
  state.drawnCards.forEach((d,i)=>{
    const rc = (result.cards && result.cards[i]) || {text:''};
    const box = document.createElement('div');
    box.className = 'reading-card';
    box.innerHTML = `
      <div class="reading-card-head">
        <div class="reading-card-pos">${d.position}</div>
        <div class="reading-card-name">${d.card.name}</div>
        <div class="reading-card-orient ${d.reversed?'':'upright'}">${d.reversed?'逆位置':'正位置'}</div>
      </div>
      <div class="reading-card-body">${escapeHtml(rc.text || '')}</div>`;
    wrap.appendChild(box);
  });

  if(result.summary){
    document.getElementById('readingSummaryBox').style.display = 'block';
    document.getElementById('readingSummary').textContent = result.summary;
  }else{
    document.getElementById('readingSummaryBox').style.display = 'none';
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('btnRedo').onclick = resetToStart;
document.getElementById('btnHome').onclick = resetToStart;

function resetToStart(){
  state = { theme:null, question:"", spreadKey:null, drawnCards:[], flippedCount:0 };
  document.getElementById('questionText').value = '';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  renderThemeChips();
  showScreen('screen-input');
}

/* ---------------------------------------------------------
   履歴 (window.storage)
--------------------------------------------------------- */
async function saveHistory(result){
  const id = 'reading:' + Date.now();
  const entry = {
    id,
    date: new Date().toISOString(),
    theme: state.theme,
    question: state.question,
    spread: SPREADS[state.spreadKey].name,
    cards: state.drawnCards.map(d=>({name:d.card.name, reversed:d.reversed, position:d.position})),
    result
  };
  if(!window.storage || typeof window.storage.set !== 'function'){
    console.error('history save skipped: window.storage not available');
    return false;
  }
  const payload = JSON.stringify(entry);
  for(let attempt=0; attempt<2; attempt++){
    try{
      const res = await window.storage.set(id, payload, false);
      if(res) return true;
    }catch(e){
      console.error('history save failed (attempt '+attempt+')', e);
      if(attempt===0) await new Promise(r=>setTimeout(r,400));
    }
  }
  return false;
}

document.getElementById('btnHistory').onclick = async ()=>{
  await renderHistory();
  showScreen('screen-history');
};

async function renderHistory(){
  const body = document.getElementById('historyBody');
  body.innerHTML = '<div class="loading-scene" style="padding:40px 0;"><div class="loading-ring"></div></div>';
  try{
    const list = await window.storage.list('reading:', false);
    if(!list || !list.keys || list.keys.length === 0){
      body.innerHTML = `<div class="history-empty">まだ記録がありません<br>占うと、ここに残っていきます</div>`;
      return;
    }
    const entries = [];
    for(const k of list.keys){
      try{
        const r = await window.storage.get(k, false);
        if(r) entries.push(JSON.parse(r.value));
      }catch(e){}
    }
    entries.sort((a,b)=> new Date(b.date) - new Date(a.date));
    const wrap = document.createElement('div');
    wrap.className = 'history-list';
    entries.forEach(en=>{
      const d = new Date(en.date);
      const dateStr = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-item-date">${dateStr} ・ ${en.spread}</div>
        <div class="history-item-q">${escapeHtml(en.theme || '総合')}${en.question ? ' — ' + escapeHtml(en.question) : ''}</div>
        <div class="history-item-cards">${en.cards.map(c=>c.name+(c.reversed?'(逆)':'')).join(' / ')}</div>`;
      item.onclick = ()=>{
        state.theme = en.theme; state.question = en.question;
        state.drawnCards = en.cards.map(c=>({card:{name:c.name}, reversed:c.reversed, position:c.position}));
        renderReading(en.result);
        document.getElementById('saveNotice').style.display = 'none';
        showScreen('screen-reading');
      };
      wrap.appendChild(item);
    });
    body.innerHTML = '';
    body.appendChild(wrap);
  }catch(e){
    body.innerHTML = `<div class="history-empty">記録の読み込みに失敗しました</div>`;
  }
}

/* init */
renderThemeChips();
</script>
</body>
